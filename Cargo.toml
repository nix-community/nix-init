[workspace]
members = ["license-store-cache"]

[workspace.package]
version = "0.3.6"
authors = ["figsoda <figsoda@pm.me>"]
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
askalono = "0.5.0"

[package]
name = "nix-init"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Generate Nix packages from URLs with hash prefetching, dependency inference, license detection, and more"
readme = "README.md"
homepage = "https://github.com/nix-community/nix-init"
repository = "https://github.com/nix-community/nix-init"
license.workspace = true
keywords = ["cli", "interactive", "generate", "nix", "package"]
categories = ["command-line-utilities"]
include = ["data", "src", "Cargo.lock", "Cargo.toml", "build.rs"]

[dependencies]
# keep-sorted start
anyhow = "1.0.104"
askalono.workspace = true
cargo = "0.100.0"
cargo-util-terminal = "0.1.2"
chumsky = "=1.0.0-alpha.8"
enum_dispatch = "0.3.13"
expand = "0.3.0"
flate2 = "1.1.10"
heck = "0.5.0"
indoc = "2.0.8"
itertools = "0.15.0"
owo-colors = "4.4.0"
parse-display = "0.11.0"
pep-508 = "0.5.0"
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
rustc-hash = "2.1.3"
secrecy = { version = "0.10.3", features = ["serde"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
serde_yaml = "0.9.34"
shlex = "2.0.1"
spdx = "0.13.6"
tar = "0.4.46"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["parsing", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
versions = "8.0.1"
which = "8.0.6"
xdg = "3.0.0"
zip = "9.1.3"
# keep-sorted end

[dependencies.clap]
version = "4.6.7"
features = ["cargo", "derive", "unicode", "wrap_help"]

[dependencies.rustyline]
version = "19.0.0"
default-features = false
features = ["derive", "with-fuzzy"]

[dependencies.tokio]
version = "1.54.1"
features = ["macros", "process", "rt-multi-thread"]

[dependencies.toml]
version = "1.1.8"
default-features = false
features = ["parse", "serde", "std"]

[build-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"

[dev-dependencies]
heck = "0.5.0"
insta = "1.49.0"
tempfile = "3.27.0"
trycmd = "1.2.1"
which = "8.0.6"

[features]
default = ["vendored"]
vendored = ["cargo/vendored-libgit2", "cargo/vendored-openssl"]

[profile.release]
lto = true
panic = "abort"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(not_build)"] }
